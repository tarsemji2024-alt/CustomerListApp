<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ग्राहक लिस्ट</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2330;--mu:#667085;--bd:#e1e6ee;--pr:#1a73e8;--ok:#0f9d58;--no:#d93025}
@media (prefers-color-scheme:dark){:root{--bg:#10141b;--card:#1a212c;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2a3342;--pr:#6ea8fe;--ok:#34c37a;--no:#ff6b60}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 10px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
input{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
button{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
#cnt{color:var(--mu);font-size:13px;margin-left:auto}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.info{flex:1;min-width:0}
.nm{font-weight:600;font-size:16px}
.sub{color:var(--mu);font-size:13px;margin-top:2px;word-break:break-all}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid currentColor;margin-left:6px}
.yes{color:var(--ok)}.not{color:var(--no)}
.call{background:var(--ok);color:#fff;padding:12px 16px;font-weight:600;border-radius:10px;text-decoration:none;white-space:nowrap}
.empty{text-align:center;color:var(--mu);padding:30px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:12px;z-index:20}
.box{background:var(--card);border-radius:12px;padding:14px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
</style>
</head>
<body>
<div class="wrap">
<h1>📋 ग्राहक लिस्ट</h1>
<div class="bar">
  <input id="q" type="search" placeholder="नाम, गाँव, मोबाइल, RSN, वर्क ऑर्डर से खोजें…" autocomplete="off">
  <div class="row">
    <button class="on" data-f="all">सभी</button>
    <button data-f="yes">Yes</button>
    <button data-f="not">Not</button>
    <button id="nw">➕ नया</button>
    <button id="dl">💾 HTML सेव</button>
    <span id="cnt"></span>
  </div>
</div>
<div id="list"></div>
</div>

<div id="m" class="modal"><div class="box">
  <h3 id="mt"></h3>
  <div id="fs"></div>
  <div class="row"><button class="on" id="sv">सेव</button><button id="del">हटाएँ</button><button id="cx">रद्द</button></div>
</div></div>

<script>
const SEED=__DATA__;/*END*/
const KEY="cl___STAMP__";
let D=SEED, flt="all", cur=-1;
try{const s=localStorage.getItem(KEY);if(s)D=JSON.parse(s)}catch(e){}
const $=id=>document.getElementById(id);
const F=[["name","ग्राहक का नाम"],["village","लोकेशन / गाँव"],["mobile","मोबाइल नंबर"],["id","वर्क ऑर्डर नंबर"],["rsn","RSN"],["type","प्रकार (ODU / IDU / STB)"],["status","रिमार्क / स्थिति"],["stb","STB सीरियल"]];
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const isYes=o=>/^(y|ok$)/i.test(o.status||"");
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function render(){
  const q=$("q").value.trim().toLowerCase(), rows=[];
  D.forEach((o,i)=>{
    if(flt==="yes"&&!isYes(o))return;
    if(flt==="not"&&isYes(o))return;
    if(q&&!Object.values(o).join(" ").toLowerCase().includes(q))return;
    rows.push([o,i]);
  });
  $("cnt").textContent=rows.length+" / "+D.length;
  $("list").innerHTML=rows.length?rows.map(([o,i])=>{
    const n=String(o.mobile||"").replace(/\D/g,"").slice(-10);
    return `<div class="item" data-i="${i}"><div class="info">
      <div class="nm">${esc(o.name)}${o.status?`<span class="tag ${isYes(o)?"yes":"not"}">${esc(o.status)}</span>`:""}</div>
      <div class="sub">📍 ${esc(o.village)} · 📱 ${esc(o.mobile)}</div>
      <div class="sub">${esc(o.type)} · RSN: ${esc(o.rsn)} · WO: ${esc(o.id)}${o.stb?" · STB: "+esc(o.stb):""}</div></div>
      ${n.length===10?`<a class="call" href="tel:+91${n}">📞 कॉल</a>`:""}</div>`;
  }).join(""):'<div class="empty">कोई रिकॉर्ड नहीं मिला</div>';
}
function openM(i){
  cur=i;const o=i>=0?D[i]:{};
  $("mt").textContent=i>=0?"देखें / बदलें":"नया ग्राहक";
  $("fs").innerHTML=F.map(([k,l])=>`<label>${l}</label><input data-k="${k}" value="${esc(o[k]||"")}">`).join("");
  $("del").style.display=i>=0?"":"none";
  $("m").style.display="flex";
}
$("q").oninput=render;
$("list").onclick=e=>{if(e.target.closest("a"))return;const it=e.target.closest(".item");if(it)openM(+it.dataset.i)};
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{
  flt=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x===b));render();});
$("nw").onclick=()=>openM(-1);
$("cx").onclick=()=>{$("m").style.display="none"};
$("sv").onclick=()=>{
  const o={};document.querySelectorAll("#fs input").forEach(x=>o[x.dataset.k]=x.value.trim());
  if(cur>=0)D[cur]=Object.assign(D[cur],o);else D.unshift(o);
  save();$("m").style.display="none";render();
};
$("del").onclick=()=>{if(confirm("इस ग्राहक को हटाएँ?")){D.splice(cur,1);save();$("m").style.display="none";render();}};
$("dl").onclick=()=>{
  const json=JSON.stringify(D).replace(/</g,"\\u003c");
  let h="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
  h=h.replace(/const SEED=[\s\S]*?;\/\*END\*\//,()=>"const SEED="+json+";/*END*/");
  h=h.replace(/const KEY="[^"]*";/,()=>'const KEY="cl_'+Date.now()+'";');
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));
  a.download="customer_list.html";a.click();
};
render();
</script>
</body>
</html>
